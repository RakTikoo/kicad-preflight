[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-preflight"
# Keep in step with preflight/__init__.py's __version__ at release time.
# (Not setuptools-dynamic: the repo-root preflight.py shim makes
# attr-based version lookup load the shim instead of the package.)
version = "0.7.0"
description = "Pre-order checks for KiCad PCB projects — BOM, Gerber package, netlist/ERC-lite and schematic-PCB parity checks that catch what DRC misses before you order."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RakTikoo" },
]
keywords = ["kicad", "pcb", "bom", "gerber", "eda", "jlcpcb", "lcsc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/RakTikoo/kicad-preflight"
Repository = "https://github.com/RakTikoo/kicad-preflight"

[project.scripts]
kicad-preflight = "preflight.__main__:main"

[tool.setuptools]
packages = ["preflight"]

[tool.setuptools.package-data]
preflight = ["data/*.json"]
